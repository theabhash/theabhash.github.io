<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>PhD Students — PAHGISL</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#f2f2f2;color:#1a1a1a;min-height:100vh}
    .page{max-width:680px;margin:0 auto;padding:2.5rem 1.25rem 5rem}
    .name{font-size:1.55rem;font-weight:500;margin-bottom:.2rem}
    .role{font-size:.82rem;color:#888;margin-bottom:2rem}
    .card{background:#fff;border-radius:12px;padding:1.4rem 1.6rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.07)}
    .card-label{font-size:.68rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#C63A1E;margin-bottom:.75rem}
    .card-body{font-size:.88rem;line-height:1.75;color:#333}
    .thesis-title{font-size:.95rem;font-weight:500;color:#1a1a1a;margin-bottom:.5rem}
    .links{display:flex;flex-direction:column;gap:.5rem}
    .link-row{display:flex;gap:.75rem;font-size:.85rem;align-items:baseline}
    .lk{color:#888;font-size:.72rem;width:72px;flex-shrink:0;text-transform:uppercase;letter-spacing:.06em}
    .link-row a{color:#1a1a1a;text-decoration:none;border-bottom:1px solid #e0e0e0}
    .link-row a:hover{border-bottom-color:#1a1a1a}
    .avatar{width:72px;height:72px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:500;color:#888;overflow:hidden;margin-bottom:1rem}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .av-init{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  </style>
  <style>
    .page-title{font-size:1.4rem;font-weight:500;margin-bottom:.3rem}
    .page-sub{font-size:.82rem;color:#888;margin-bottom:2rem}
    .student-row{display:flex;align-items:center;gap:1rem;background:#fff;border-radius:12px;padding:1rem 1.4rem;margin-bottom:.75rem;text-decoration:none;color:#1a1a1a;box-shadow:0 1px 3px rgba(0,0,0,.07);transition:box-shadow .2s}
    .student-row:hover{box-shadow:0 3px 10px rgba(0,0,0,.12)}
    .s-avatar{width:44px;height:44px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:500;color:#888;flex-shrink:0;overflow:hidden}
    .s-avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .av-init{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    .s-name{font-size:.95rem;font-weight:500}
    .s-role{font-size:.76rem;color:#aaa;margin-top:.1rem}
  </style>
</head>
<body>
<div class="page">
  <div class="card-label" style="margin-bottom:.6rem">PAHGISL @ University of Sydney</div>
  <div class="page-title">PhD Students</div>
  <div class="page-sub">Precision Agriculture, Hydrology &amp; Geoinformation Science Laboratory</div>
  
  <a class="student-row" href="qazi-muqeet-amir.html">
    <div class="s-avatar">
      <img src="photos/qazi_muqeet_amir.jpg" alt="Qazi Muqeet Amir"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
      <span class="av-init" style="display:none">QMA</span>
    </div>
    <div>
      <div class="s-name">Qazi Muqeet Amir</div>
      <div class="s-role">PhD Student</div>
    </div>
  </a>
  <a class="student-row" href="padam-raj-bist.html">

           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
      <span class="av-init" style="display:none">PRB</span>
    </div>
    <div>
      <div class="s-name">Padam Raj Bist</div>
      <div class="s-role">PhD Student</div>
    </div>
  </a>

           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
      <span class="av-init" style="display:none">HP</span>
    </div>
    <div>
      <div class="s-name">Harry Paine</div>
      <div class="s-role">PhD Student</div>

    </div>
    <div>
      <div class="s-name">Wiyanda Naufal Aflah</div>
      <div class="s-role">PhD Student</div>
    </div>
  </a>
  <a class="student-row" href="saba-zehra.html">
    <div class="s-avatar">
      <img src="photos/saba_zehra.jpg" alt="Saba Zehra"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
      <span class="av-init" style="display:none">SZ</span>
    </div>
    <div>
      <div class="s-name">Saba Zehra</div>
      <div class="s-role">PhD Student</div>
    </div>
  </a>
  <a class="student-row" href="billal-hossen.html">
    <div class="s-avatar">
      <img src="photos/billal_hossen.jpg" alt="Billal Hossen"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
      <span class="av-init" style="display:none">BH</span>
    </div>
    <div>
      <div class="s-name">Billal Hossen</div>
      <div class="s-role">PhD Student</div>
    </div>
  </a>
</div>
</body>
</html>
