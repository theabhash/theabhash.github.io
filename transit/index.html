<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Commute</title>
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Commute">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <h1>My Commute</h1>
    <div class="sub" id="clock">--</div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="refreshBtn" aria-label="Refresh">&#x21bb;</button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">&#9881;</button>
  </div>
</header>

<main>
  <div id="setupBanner" class="banner" hidden>
    Add your free Transport for NSW API key in <button class="link" id="openSettings2">Settings</button> to see live data.
  </div>

  <section class="card">
    <div class="card-head">
      <h2>&#x1F68C; Buses</h2>
      <span class="stamp" id="busStamp"></span>
    </div>
    <div id="map"></div>
    <div id="busList" class="list"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>&#x1F686; Trains</h2>
      <span class="stamp" id="trainStamp"></span>
    </div>
    <div class="seg" role="tablist">
      <button data-dir="auto" class="on">Auto</button>
      <button data-dir="out">To city</button>
      <button data-dir="back">Home</button>
    </div>
    <div class="route-title" id="routeTitle"></div>
    <div id="trainList" class="list"></div>
  </section>
</main>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Settings</h2>
    <label>TfNSW API key
      <input name="apiKey" autocomplete="off" spellcheck="false" placeholder="Paste key from opendata.transport.nsw.gov.au">
    </label>
    <label>Proxy URL <small>(optional, only if direct calls are blocked)</small>
      <input name="proxy" autocomplete="off" spellcheck="false" placeholder="https://my-proxy.workers.dev">
    </label>
    <label>Bus numbers to track <small>(route or fleet numbers, comma separated)</small>
      <input name="buses" autocomplete="off">
    </label>
    <div class="row2">
      <label>Home station <input name="from"></label>
      <label>City station <input name="to"></label>
    </div>
    <label>Switch direction at (hour, 24h)
      <input name="cutover" type="number" min="0" max="23">
    </label>

    <details>
      <summary>Bus finder (search live feed)</summary>
      <p class="hint">Type a number to see every live bus whose route, fleet ID or label contains it. Use this to check what your bus is called in the feed.</p>
      <input id="finderInput" placeholder="e.g. 1035" autocomplete="off">
      <div id="finderOut" class="finder"></div>
    </details>

    <div class="actions">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="save" id="saveBtn" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
